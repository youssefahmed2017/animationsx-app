<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset your AnimationsX password</title>
</head>

<body style="
  margin:0;
  padding:0;
  background: #f5f5f5;
  font-family:Arial, Helvetica, sans-serif;
  color:#f5f5f5;
">

  <div style="
    max-width:560px;
    margin:40px auto;
    padding:0 20px;
  ">

    <!-- Header -->
    <div style="
      padding:18px 0;
      border-bottom:1px solid #292929;
    ">
      <h1 style="
        font-size:18px;
        font-weight:700;
        color:#0b0b0b;
        text-align: center;
      ">
        AnimationsX
      </h1>
    </div>

    <!-- Card -->
    <div style="
      margin-top:28px;
      background:#171717;
      border:1px solid #303030;
      border-radius:8px;
      padding:32px;
    ">

      <h1 style="
        margin:0 0 12px;
        font-size:24px;
        line-height:1.3;
        color:#f5f5f5;
      ">
        Reset your password
      </h1>

      <p style="
        margin:0 0 24px;
        font-size:14px;
        line-height:1.6;
        color:#a3a3a3;
      ">
        We received a request to reset your AnimationsX password.
        Click the button below to choose a new one.
      </p>

      <!-- Button -->
      <a
        href="{{ .ConfirmationURL }}"
        style="
          display:inline-block;
          padding:10px 18px;
          background:#ffffff;
          color:#111111;
          text-decoration:none;
          border-radius:6px;
          font-size:14px;
          font-weight:600;
        "
      >
        Reset password
      </a>

      <p style="
        margin:24px 0 0;
        font-size:13px;
        line-height:1.5;
        color:#737373;
      ">
        If you didn't request this, you can safely ignore this email.
      </p>

    </div>

    <!-- Footer -->
    <div style="
      padding:22px 4px;
      text-align:center;
      color:#0b0b0b;
      font-size:12px;
    ">
      <div style="margin-bottom:6px;">
        AnimationsX
      </div>

      <div>
        Publish. Browse. Fork.
      </div>
    </div>

  </div>

</body>
</html>
